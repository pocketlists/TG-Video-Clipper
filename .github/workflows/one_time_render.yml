name: One-Time Story Video Renderer

on:
  workflow_dispatch:

permissions:
  contents: read

# Naya run purane ko cancel kar dega (do bots ek saath reply na karein)
concurrency:
  group: one-time-render
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache local Whisper model
        uses: actions/cache@v5
        with:
          path: ~/.cache/whisper
          key: whisper-${{ runner.os }}-base-v1
          restore-keys: |
            whisper-${{ runner.os }}-base-

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: ~3 GB CUDA libraries download se bachta hai
          pip install torch --index-url https://download.pytorch.org/whl/cpu || pip install torch
          pip install -r requirements.txt

      - name: Run Bot
        env:
          PYTHONUNBUFFERED: "1"
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          WHISPER_LOCAL_MODEL: base
          MAX_UPLOAD_MB: "1500"
          IDLE_TIMEOUT_MIN: "45"
          TG_DEBUG: "1"
        run: |
          python -u main.py
