name: Manga Video Cloud Renderer

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Telegram Zip File URL'
        required: true
      chat_id:
        description: 'Telegram Chat ID to send video back'
        required: true

jobs:
  build-video:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg (System Requirement)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv pydub google-generativeai openai requests Pillow

      - name: Download and Extract ZIP from Telegram
        run: |
          echo "Downloading ZIP..."
          curl -s -L "${{ github.event.inputs.file_url }}" -o manga_data.zip
          echo "Extracting ZIP..."
          unzip -o manga_data.zip -d ./
          rm manga_data.zip

      - name: Run AI Video Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: |
          python manga_recap_agent.py

      - name: Send Final Video back to Telegram
        if: success()
        run: |
          echo "Uploading Video to Telegram..."
          curl -F document=@"output/final_manga_recap.mp4" \
               -F chat_id="${{ github.event.inputs.chat_id }}" \
               -F caption="🎉 Yeh rahi tumhari Final AI Manga Video!" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument"

      - name: Send Error Message to Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
               -d chat_id="${{ github.event.inputs.chat_id }}" \
               -d text="❌ Bhai, Cloud server par rendering fail ho gayi! GitHub Actions ke logs check karo."
